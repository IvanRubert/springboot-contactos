spring.application.name=contactos

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/contactos?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sa

# Hibernate crea/actualiza las tablas a partir de las entidades (solo en desarrollo)
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta
spring.jpa.show-sql=true