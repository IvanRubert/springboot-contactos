<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(tituloFragmento, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${tituloFragmento}">Título por defecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-secondary">Cerrar sesión</button>
    </form>
    
    <main th:replace="${contenido}"></main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
