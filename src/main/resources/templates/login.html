<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Iniciar sesión</title></head>
<body>
<section>
    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="alert alert-danger">Email o contraseña incorrectos</div>
        <div th:if="${param.logout}" class="alert alert-success">Has cerrado la sesión</div>

        <h1 class="h3 mb-3">Please sign in</h1>
        <label for="username" class="form-label">Email</label>
        <input type="email" id="username" name="username" class="form-control" required autofocus>
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
        <button class="btn btn-lg btn-primary mt-3" type="submit">Sign in</button>
    </form>
</section>
</body>
</html>
