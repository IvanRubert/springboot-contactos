<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>Registrarse</title></head>
<body>
<section>
    <form th:action="@{/register}" method="post" th:object="${usuario}">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">Por favor, corrige los errores del formulario</div>

        <h1 class="h3 mb-3">Registrarse</h1>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required autofocus>
            <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="invalid-feedback">Error en nombre</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required autofocus>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback">Error en email</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" required>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback">Error en contraseña</div>
        </div>
        <button class="btn btn-lg btn-primary mt-3" type="submit">Registrarse</button>
    </form>
</section>
</body>
</html>
